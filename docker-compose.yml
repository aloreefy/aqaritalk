services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aqaritalk
      POSTGRES_USER: aqaritalk
      POSTGRES_PASSWORD: aqaritalk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqaritalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://aqaritalk:aqaritalk_dev@postgres:5432/aqaritalk
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/artifacts/api-server/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      PORT: 5173
      BASE_PATH: /
      API_URL: http://api:8080
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
