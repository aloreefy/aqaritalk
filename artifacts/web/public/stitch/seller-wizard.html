<!DOCTYPE html>

<meta charset="utf-8"/>

<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex flex-row-reverse items-center justify-between px-4 h-16 w-full fixed top-0 z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flat no shadows active:scale-95 transition-transform duration-150">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-highest p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<h1 class="font-headline text-lg font-bold font-black text-primary dark:text-primary-fixed-dim">إضافة عقار جديد</h1>
<div class="w-10"></div> <!-- Spacer -->
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-20 px-6 max-w-lg mx-auto w-full">
<!-- Progress Stepper -->
<section aria-label="Progress" class="mb-8">
<div class="flex items-center justify-between relative mb-2">
<!-- Line -->
<div aria-hidden="true" class="absolute inset-y-1/2 left-0 right-0 h-0.5 bg-surface-variant -z-10 w-full"></div>
<div aria-hidden="true" class="absolute inset-y-1/2 right-0 h-0.5 bg-primary -z-10" style="width: 50%;"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="text-xs font-label text-primary">النوع</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="text-xs font-label text-primary">الموقع</span>
</div>
<!-- Step 3 (Active) -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center mb-1 outline outline-2 outline-offset-2 outline-primary">
<span class="text-xs font-bold">٣</span>
</div>
<span class="text-xs font-label text-primary font-bold">السعر</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center mb-1">
<span class="text-xs">٤</span>
</div>
<span class="text-xs font-label text-on-surface-variant">الصور</span>
</div>
<!-- Step 5 -->
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center mb-1">
<span class="text-xs">٥</span>
</div>
<span class="text-xs font-label text-on-surface-variant">المراجعة</span>
</div>
</div>
<p class="text-center text-sm text-on-surface-variant font-label mt-2">الخطوة ٣ من ٥</p>
</section>
<!-- Summary Chips -->
<section aria-label="Property Summary" class="mb-8">
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1 bg-surface-container-high text-on-surface rounded-lg text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">home</span>
                    فيلا
                </span>
<span class="px-3 py-1 bg-surface-container-high text-on-surface rounded-lg text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                    مرج الحمام، عمّان
                </span>
<span class="px-3 py-1 bg-surface-container-high text-on-surface rounded-lg text-sm font-medium flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">bed</span>
                    ٦ غرف
                </span>
</div>
</section>
<!-- Pricing Form -->
<section class="space-y-6 bg-surface-container-lowest p-6 rounded-xl shadow-sm border border-outline-variant/30">
<!-- Deal Type Toggle -->
<div>
<label class="block text-sm font-medium text-on-surface mb-3 font-label">نوع الصفقة</label>
<div class="flex p-1 bg-surface-container-low rounded-lg border border-outline-variant/50">
<button class="flex-1 py-2 text-center rounded-md bg-primary text-on-primary font-medium text-sm transition-colors shadow-sm">
                        للبيع
                    </button>
<button class="flex-1 py-2 text-center rounded-md text-on-surface-variant hover:bg-surface-container-high font-medium text-sm transition-colors">
                        للإيجار
                    </button>
</div>
</div>
<!-- Price Input -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2 font-label" for="price-input">السعر</label>
<div class="relative mt-1 rounded-md shadow-sm">
<input class="block w-full rounded-lg border-outline-variant py-4 pl-12 pr-4 text-left text-2xl font-bold font-headline text-on-background focus:border-primary focus:ring-primary sm:text-2xl rtl:text-right transition-colors" id="price-input" name="price" type="text" value="١٦٢٬٥٠٠"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
<span class="text-on-surface-variant text-lg font-medium">د.أ</span>
</div>
</div>
</div>
<!-- Negotiation Toggle -->
<div class="flex items-center justify-between pt-2">
<span class="text-sm font-medium text-on-surface font-label flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">handshake</span>
                    قابل للتفاوض
                </span>
<button aria-checked="true" class="bg-primary relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" role="switch" type="button">
<span class="translate-x-0 rtl:-translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-surface-container-lowest shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Helper Card -->
<div class="mt-6 bg-primary-container/20 border border-primary-container rounded-lg p-4 flex gap-3 items-start">
<span class="material-symbols-outlined text-primary mt-0.5">info</span>
<p class="text-sm text-on-primary-container font-medium leading-relaxed">
                    متوسط أسعار فلل مرج الحمام: ١٤٠٬٠٠٠ – ٢٠٠٬٠٠٠ د.أ
                </p>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex flex-row-reverse justify-between items-center px-6 py-4 bg-surface dark:bg-surface-container shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] shadow-lg rounded-t-xl docked full-width">
<button class="flex flex-row-reverse items-center justify-center bg-primary dark:bg-primary-dim text-on-primary rounded-full px-8 py-3 font-label text-sm font-medium hover:brightness-110 active:scale-98 transition-all gap-2 w-1/2 ml-2">
<span class="material-symbols-outlined">chevron_left</span>
            التالي
        </button>
<button class="flex flex-row-reverse items-center justify-center text-on-surface-variant dark:text-outline border border-outline-variant rounded-full px-8 py-3 font-label text-sm font-medium hover:brightness-110 active:scale-98 transition-all gap-2 w-1/2 mr-2 bg-transparent">
            السابق
            <span class="material-symbols-outlined">chevron_right</span>
</button>
</nav>
<script>
        // Simple toggle for the negotiation switch for visual feedback
        const toggleBtn = document.querySelector('button[role="switch"]');
        const toggleKnob = toggleBtn.querySelector('span');
        
        toggleBtn.addEventListener('click', () => {
            const isChecked = toggleBtn.getAttribute('aria-checked') === 'true';
            toggleBtn.setAttribute('aria-checked', !isChecked);
            
            if (isChecked) {
                toggleBtn.classList.remove('bg-primary');
                toggleBtn.classList.add('bg-outline-variant');
                toggleKnob.classList.remove('rtl:-translate-x-5');
                toggleKnob.classList.add('translate-x-0');
            } else {
                toggleBtn.classList.add('bg-primary');
                toggleBtn.classList.remove('bg-outline-variant');
                toggleKnob.classList.add('rtl:-translate-x-5');
                toggleKnob.classList.remove('translate-x-0');
            }
        });
    </script>
</body></html>
